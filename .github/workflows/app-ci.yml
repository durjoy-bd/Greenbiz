name: GreenBiz checks
on:
  push:
    branches: [main]
  pull_request:
defaults:
  run:
    working-directory: App-Website
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: App-Website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:server
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Create the first Super Admin
        run: GREENBIZ_ADMIN_EMAIL=ci-admin@example.test GREENBIZ_ADMIN_PASSWORD='Ci-Admin-pass-42!' DATABASE_PATH=./tmp/ci.sqlite npx tsx server/admin.ts create-super-admin
      - name: Start temporary API
        # The throwaway CI server allows more sign-ups than production's 10 per 15 minutes,
        # and writes emails to tmp/outbox so the browser tests can open confirmation links.
        run: AUTH_RATE_LIMIT_MAX=1000 RATE_LIMIT_MAX=5000 MAIL_TRANSPORT=outbox MAIL_OUTBOX_DIR=./tmp/outbox PUBLIC_ORIGIN=http://127.0.0.1:5173 DATABASE_PATH=./tmp/ci.sqlite npm run server > /tmp/greenbiz-api.log 2>&1 &
      - run: npx playwright test
        env:
          E2E_ADMIN_EMAIL: ci-admin@example.test
          E2E_ADMIN_PASSWORD: Ci-Admin-pass-42!
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: App-Website/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The default package list still includes the removed "tools" package.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run android:sync
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew testDebugUnitTest assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GreenBiz-Android-internal
          path: |
            App-Website/android/app/build/outputs/apk/debug/*.apk
            App-Website/android/app/build/outputs/bundle/release/*.aab
  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Managed-AI-Service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Managed-AI-Service/package-lock.json
      - run: npm ci
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: npm test
